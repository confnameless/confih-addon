# Live Cloudflare Tunnel path for a private / NATed server.
#
# Start the complete live stack (vpn + addon + tunnel, no Caddy):
#
#   docker compose -f docker-compose.vpn.yml -f docker-compose.tunnel.yml \
#     up -d --build
#
# This is the *production* stack: one addon service, one tunnel, no staging
# container. Every setting comes from .env on the host (ADDON_NAME,
# ADDON_ID, ADDON_VERSION, auth, path secret), so what runs here is whatever
# that file says — never a value baked into this file.
#
# A separate staging host can still be started on top of this one:
#
#   docker compose -f docker-compose.vpn.yml -f docker-compose.tunnel.yml \
#     -f docker-compose.test.yml up -d addon-test
#
# The tunnel container connects to http://addon:8000 over the Compose network.
# It does not use Caddy and does not publish 80/443. Cloudflare terminates TLS;
# the addon sends HSTS when it sees X-Forwarded-Proto: https.
#
# Prerequisites on the host:
#   - cloudflared/config.yml with `service: http://addon:8000`
#   - cloudflared/<tunnel-id>.json, mode 400
#   - CLOUDFLARED_UID/CLOUDFLARED_GID in .env matching the file owner
#
# The whole cloudflared/ directory is a secret: it is ignored by git, rsync and
# the Docker build context. Do not commit it or copy it into an image.

services:
  addon:
    ports:
      # Localhost only. The tunnel container uses the Compose network; this
      # mapping is for local debugging and host-side tools. Nothing is exposed
      # directly to the internet.
      - "127.0.0.1:8000:8000"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # The image defaults to uid 65532; run as the host account that owns the
    # mode-400 credentials so the connector can read them. Set
    # CLOUDFLARED_UID/CLOUDFLARED_GID in .env; the Oracle ubuntu user is 1001.
    user: "${CLOUDFLARED_UID:-1000}:${CLOUDFLARED_GID:-1000}"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      addon:
        condition: service_healthy
    networks:
      - addon
